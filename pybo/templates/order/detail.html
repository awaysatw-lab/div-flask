{% extends 'base.html' %}

{% block title %}예약 상세 내역 - {{ order.order_no }}{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/lookup.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/nearby_slide.css') }}">

<div class="container page-content">
  <div class="page-header">
    <h1>예약 상세 정보</h1>
    <p>주문번호 <strong>{{ order.order_no }}</strong>의 상세 예약 및 결제 내역입니다.</p>
  </div>

  <div class="standalone-detail-wrap" style="max-width: 860px; margin: 0 auto;">
    {% include 'order/_detail_card.html' %}

    <div style="margin-top: 28px; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;">
      <a href="{{ url_for('order.lookup') }}" class="btn-outline-back">
        &lt; 예약 목록으로 돌아가기
      </a>
      <a href="/" class="btn-primary-action">
        홈으로 이동
      </a>
    </div>
  </div>
</div>
{% endblock %}
