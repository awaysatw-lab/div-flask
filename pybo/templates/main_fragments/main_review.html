<!-- 여행 후기 조각 -->
<section class="travel-reviews">
    <h3>💬 여행 후기</h3>

    <div class="review-wrapper">
        <div class="review-grid">
            {% if review_list %}
                {% for review in review_list %}
                <a href="{{ url_for('main.review_detail', review_id=review.id) }}" class="review-card" style="text-decoration: none; color: inherit; display: block;">
                    <div class="thumb" style="background-image: url('{{ url_for('static', filename='img/' ~ review.image_file) if review.image_file else url_for('static', filename='img/default_review.jpg') }}'); background-size: cover; background-position: center;"></div>
                    <p>
                        <strong>{{ review.title }}</strong><br>
                        <span style="color: #888; font-size: 0.75rem;">★ {{ review.rating }} | {{ review.user.name if review.user else '익명' }}님</span>
                    </p>
                </a>
                {% endfor %}
            {% else %}
                <div class="review-card" style="grid-column: span 5; display: flex; align-items: center; justify-content: center; min-height: 150px; color: #999; font-size: 0.9rem;">
                    아직 등록된 여행 후기가 없습니다. 첫 후기를 남겨보세요!
                </div>
            {% endif %}
        </div>
    </div>
</section>
