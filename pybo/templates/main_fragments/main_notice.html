<div class="info-footer-box-wrap">
    <div class="info-footer-inside">

        <div class="notice-section">
            <a href="{{ url_for('main.notice') }}" class="text-decoration-none text-dark"><h3>공지사항 및 새소식</h3></a>
            <ul>
                <!-- 플라스크 문법으로 변경: 데이터가 있을 때만 반복문 실행 -->
                {% if latest_notices %}
                    {% for notice in latest_notices %}
                    <li>
                        <!-- 상세 페이지 라우트 매핑 (아코디언 자동 펼침) -->
                        <a href="{{ url_for('main.notice_detail', notice_id=notice.id) }}">
                            [{{ notice.category }}] {{ notice.subject }}
                        </a>
                    </li>
                    {% endfor %}
                {% else %}
                    <!-- 공지사항이 비어있을 때 출력 -->
                    <li>등록된 공지사항이 없습니다.</li>
                {% endif %}
            </ul>
        </div>

        <div class="cs-box">
            <a href="{{ url_for('customer.faq_list') }}" class="text-decoration-none text-dark"><h4>고객센터</h4></a>
            <div class="phone">1577-1233</div>
            <div class="time">
                평일 09:00 ~ 18:00 (토/일, 공휴일 휴무)<br>
                점심시간 12:00 ~ 13:00 / 이메일 help@gilmajungtour.com
            </div>
        </div>

    </div>
</div>
