{% extends 'base.html' %}
{% block title %}길마중 - 회원가입{% endblock %}

{% block content %}
<div class="signup-container" style="max-width: 450px; margin: 50px auto; padding: 30px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-family: 'Malgun Gothic', dotum, sans-serif;">

    <h3 style="text-align: center; color: #0d6efd; margin-bottom: 25px; font-weight: bold;">✈️ 패키지 여행 회원가입</h3>

    {% for message in get_flashed_messages() %}
    <div class="alert alert-danger" style="color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px;">
        ⚠️ {{ message }}
    </div>
    {% endfor %}

    <form method="post" id="signupForm">
        {{ form.csrf_token }}

        <!-- 아이디 입력란 ([변경] 중복확인 버튼 배치를 위해 flex 구조 적용) -->
        <div class="form-group" style="margin-bottom: 18px;">
            <label for="user_id" style="display: block; font-weight: bold; margin-bottom: 6px; color: #333;">아이디</label>
            <div style="display: flex; gap: 8px;">
                <!-- 한글 입력을 방지하기 위한 oninput 스크립트 추가 -->
                <input type="text" id="user_id" name="user_id" style="flex: 1; padding: 10px; border: 1px solid #cccccc; border-radius: 6px; box-sizing: border-box;" placeholder="영문, 숫자 4~25자" value="{{ request.form['user_id'] or '' }}" oninput="this.value = this.value.replace(/[^a-zA-Z0-9]/g, '')" required>
                <button type="button" id="btnCheckId" style="padding: 10px 15px; background-color: #6c757d; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; white-space: nowrap;">중복확인</button>
            </div>
            <!-- 중복확인 상태 메시지 출력 공간 -->
            <div id="idCheckMessage" style="font-size: 13px; margin-top: 5px; font-weight: bold;"></div>
        </div>

        <!-- 이름 입력란 -->
        <div class="form-group" style="margin-bottom: 18px;">
            <label for="name" style="display: block; font-weight: bold; margin-bottom: 6px; color: #333;">이름</label>
            <input type="text" id="name" name="name" style="width: 100%; padding: 10px; border: 1px solid #cccccc; border-radius: 6px; box-sizing: border-box;" placeholder="실명 입력 (예약 확인용)" value="{{ request.form['name'] or '' }}" required>
        </div>

        <!-- 이메일 입력란 -->
        <div class="form-group" style="margin-bottom: 18px;">
            <label for="email" style="display: block; font-weight: bold; margin-bottom: 6px; color: #333;">이메일 주소</label>
            <input type="email" id="email" name="email" style="width: 100%; padding: 10px; border: 1px solid #cccccc; border-radius: 6px; box-sizing: border-box;" placeholder="example@email.com" value="{{ request.form['email'] or '' }}" required>
        </div>

        <!-- 전화번호 입력란 -->
        <div class="form-group" style="margin-bottom: 18px;">
            <label for="phone" style="display: block; font-weight: bold; margin-bottom: 6px; color: #333;">전화번호</label>
            <input type="text" id="phone" name="phone" style="width: 100%; padding: 10px; border: 1px solid #cccccc; border-radius: 6px; box-sizing: border-box;" placeholder="010-XXXX-XXXX" value="{{ request.form['phone'] or '' }}" required>
        </div>

        <!-- 비밀번호 입력란 -->
        <div class="form-group" style="margin-bottom: 18px;">
            <label for="password" style="display: block; font-weight: bold; margin-bottom: 6px; color: #333;">비밀번호</label>
            <input type="password" id="password" name="password" style="width: 100%; padding: 10px; border: 1px solid #cccccc; border-radius: 6px; box-sizing: border-box;" placeholder="비밀번호 설정" required>
        </div>

        <!-- 비밀번호 확인 입력란 -->
        <div class="form-group" style="margin-bottom: 28px;">
            <label for="password_confirm" style="display: block; font-weight: bold; margin-bottom: 6px; color: #333;">비밀번호 확인</label>
            <input type="password" id="password_confirm" name="password_confirm" style="width: 100%; padding: 10px; border: 1px solid #cccccc; border-radius: 6px; box-sizing: border-box;" placeholder="비밀번호 다시 입력" required>
        </div>

        <button type="submit" style="width: 100%; padding: 14px; background-color: #0d6efd; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;">동의하고 가입하기</button>
    </form>
</div>

<!-- 비동기 중복 검사를 위한 JavaScript 처리 (Ajax) -->
<script>
let isIdChecked = false; // 중복 확인 완료 여부 플래그

document.getElementById('btnCheckId').addEventListener('click', function() {
    const userId = document.getElementById('user_id').value.trim();
    const messageEl = document.getElementById('idCheckMessage');

    if(!userId) {
        alert('아이디를 먼저 입력해 주세요.');
        return;
    }

    // Flask 백엔드로 비동기 POST 요청 송신
    fetch("{{ url_for('auth.check_id') }}", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ user_id: userId })
    })
    .then(response => response.json())
    .then(data => {
        if(data.status === 'success') {
            messageEl.style.color = "green";
            messageEl.innerText = "✓ " + data.message;
            isIdChecked = true; // 가입 허용 상태 전환
        } else {
            messageEl.style.color = "red";
            messageEl.innerText = "✕ " + data.message;
            isIdChecked = false;
        }
    })
    .catch(err => {
        console.error(err);
        alert('중복 확인 중 오류가 발생했습니다.');
    });
});

// 아이디 입력창의 값이 바뀌면 중복확인을 다시 하도록 리셋
document.getElementById('user_id').addEventListener('input', function() {
    isIdChecked = false;
    document.getElementById('idCheckMessage').innerText = "";
});

// [최종 가입 전 방어 세팅] 중복확인을 안 눌렀다면 제출 막기
document.getElementById('signupForm').addEventListener('submit', function(e) {
    if(!isIdChecked) {
        e.preventDefault(); // 폼 전송 중단
        alert('아이디 중복확인을 반드시 수행해 주세요.');
    }
});
</script>
{% endblock %}
