<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>길마중 - 회원가입</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css') }}">
</head>
<body>

<div class="signup-wrapper">
    <div class="signup-container">
        <div class="logo-placeholder">
            <div class="logo-bars">
                <div class="bar bar1"></div>
                <div class="bar bar2"></div>
                <div class="bar bar3"></div>
                <div class="bar bar4"></div>
                <div class="logo-pin"></div>
            </div>
        </div>

        <h2>회원가입</h2>
        <div class="welcome-text">
            길마중에 오신 것을 환영합니다.<br>
            간편 가입하고 전 상품 우대 혜택을 누려보세요.
        </div>

        <div class="benefit-banner">
            <span class="benefit-tag">회원 혜택</span>
            <span class="benefit-text">전 상품 <strong>10~20% 특별 할인</strong> 및 추천 숙소 연계 예약</span>
        </div>

        {% include 'auth/errors.html' %}

        <form method="post" id="signupForm" novalidate>
            <input type="hidden" id="csrf_token" name="csrf_token" value="{{ form.csrf_token._value() }}">
            <div class="input-group">
                <div class="id-input-wrapper">
                    <div class="id-input-inner">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" id="user_id" name="user_id" placeholder="로그인 아이디 (4~25자)" value="{{ form.user_id.data or '' }}" oninput="this.value = this.value.replace(/[^a-zA-Z0-9]/g, '')" required>
                    </div>
                    <button type="button" id="btnCheckId" class="btn-check-id">중복확인</button>
                </div>
                <div id="idCheckMessage" class="check-message"></div>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-user-check input-icon"></i>
                <input type="text" id="name" name="name" placeholder="실명 또는 사용자 이름" value="{{ form.name.data or '' }}" required>
            </div>

            <div class="input-group">
                <i class="fa-regular fa-envelope input-icon"></i>
                <input type="email" id="email" name="email" placeholder="이메일 주소 (예: user@example.com)" value="{{ form.email.data or '' }}" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-mobile-screen-button input-icon"></i>
                <input type="text" id="phone" name="phone" placeholder="휴대폰 번호 (예: 010-1234-5678)" value="{{ form.phone.data or '' }}" required>
            </div>

            <div class="password-row">
                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" name="password" placeholder="비밀번호" required>
                    <i class="fa-regular fa-eye toggle-password" data-target="password"></i>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-shield-halved input-icon"></i>
                    <input type="password" id="password_confirm" name="password_confirm" placeholder="비밀번호 확인" required>
                    <i class="fa-regular fa-eye toggle-password" data-target="password_confirm"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit">회원가입 완료하기</button>
        </form>

        <div class="divider-container">
            <span class="divider-text">또는</span>
        </div>

        <div class="login-prompt">이미 계정이 있으신가요?</div>
        <button type="button" id="btnGoToLogin" class="btn-login">로그인하기 &gt;</button>
    </div>
</div>

<script>
    window.checkIdUrl = "{{ url_for('auth.check_id') }}";
</script>
<script src="{{ url_for('static', filename='js/signup.js') }}"></script>
</body>
</html>
