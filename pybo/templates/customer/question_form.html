{% extends 'base.html' %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/customer.css') }}">

<div class="container my-5" style="max-width: 550px;">
    <div class="text-center mb-4">
        <h3 class="fw-bold" style="color: #1A365D;">여행 문의하기</h3>
        <p class="text-muted small">문의 내용을 남겨주시면 기재하신 이메일로 신속히 답변해 드립니다.</p>
    </div>

    <div class="cs-card">
        <form method="post" class="post-form">
            {{ form.csrf_token }}
            {% include "customer/customer_errors.html" %}

            <div class="mb-4">
                <label for="subject" class="form-label small fw-bold text-secondary">문의 제목</label>
                <input type="text" class="form-control" name="subject" id="subject" value="{{ form.subject.data or '' }}" placeholder="제목을 입력해 주세요">
            </div>

            <div class="mb-4">
                <label for="email" class="form-label small fw-bold text-secondary">답변받을 이메일 주소</label>
                <input type="email" class="form-control" name="email" id="email" value="{{ form.email.data or '' }}" placeholder="example@domain.com">
            </div>

            <div class="mb-4">
                <label for="content" class="form-label small fw-bold text-secondary">문의 내용</label>
                <textarea class="form-control" name="content" id="content" rows="6" placeholder="자세한 문의 내용을 작성해 주세요"></textarea>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                <a href="{{ url_for('customer.faq_list') }}" class="btn btn-light-custom flex-grow-1 flex-md-grow-0">취소</a>
                <button type="submit" class="btn btn-navy flex-grow-1 flex-md-grow-0 px-4">제출하기</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
