{% extends 'base.html' %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/customer.css') }}">

<div class="container py-5" style="max-width: 800px; width: 100%; margin-left: auto; margin-right: auto; margin-top: 30px; margin-bottom: 60px;">
    
    <!-- 1. 상단 내비게이션 바 (목록으로 돌아가기) -->
    <div class="mb-4" style="width: 100%;">
        <a href="{{ url_for('customer.faq_list') }}" class="btn btn-light-custom" style="font-size: 0.9rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
            <span>←</span> 목록으로 돌아가기
        </a>
    </div>

    <!-- 2. 문의 본문 상세 카드 상자 -->
    <div class="cs-card" style="background: #ffffff; border: 1px solid #EAE6DF; border-radius: 8px; padding: 45px 40px; box-shadow: 0 4px 24px rgba(0,0,0,0.01); width: 100%;">
        
        <!-- 상단 헤더 메타 정보 -->
        <div style="border-bottom: 1px solid #EAE8E4; padding-bottom: 25px; margin-bottom: 30px;">
            <span class="text-muted small tracking-wide" style="color: #8E90A6 !important; font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 8px;">1:1 INQUIRY DETAIL</span>
            <!-- 문의 제목 -->
            <h3 class="fw-bold" style="color: #1E3A5F; font-size: 1.6rem; margin-bottom: 15px; line-height: 1.4;">
                {{ question.subject }}
            </h3>
            
            <!-- 작성 정보 열람 바 -->
            <div style="display: flex; gap: 20px; color: #7A7A85; font-size: 0.88rem;">
                <div><strong style="color: #2B2D42;">작성자 :</strong> {{ question.email }}</div>
                <div><strong style="color: #2B2D42;">등록일 :</strong> {{ question.create_date.strftime('%Y-%m-%d %H:%M') }}</div>
            </div>
        </div>

        <!-- 문의 세부 내용 내용 영역 -->
        <div style="min-height: 250px; color: #2B2D42; font-size: 1.02rem; line-height: 1.8; white-space: pre-wrap; padding: 10px 5px;">{{ question.content }}</div>

    </div>

    <!-- 3. [선택 사항] 추후 답변 완료 기능 도입 시 들어갈 영역 -->
    <div class="mt-4 px-2 text-muted small" style="text-align: right; color: #8E90A6 !important;">
        정성껏 확인 후 기재하신 이메일 혹은 고객센터 내역을 통해 순차적으로 답변해 드립니다.
    </div>

</div>
{% endblock %}
