<!-- [독립 컴포넌트] 🟠 길마중 Q&A (질문답변) 섹션 -->
<section class="qa-custom-section my-5 px-3">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <div>
            <h2 class="mb-1 fw-bold fs-4" style="color: #212529;">🙋‍♂️ 자주 묻는 질문 / 답변</h2>
            <p class="text-muted small mb-0">길마중 여행에 대해 궁금한 점을 빠르게 확인해보세요.</p>
        </div>
        <!-- 지속적 업데이트 기능을 수행하는 비동기 트리거 버튼 -->
        <button class="btn btn-primary btn-sm fw-bold py-2 px-3 shadow-sm" id="btnLoadMoreQA">
            질문 더보기 ↻
        </button>
    </div>

    <!-- [기능 1] 버튼창 이동 가이드 (특정 질문 영역으로 앵커 이동) -->
    <div class="qa-quick-navigation mb-4 p-3 bg-light rounded-3 d-flex flex-wrap gap-2 align-items-center">
        <span class="fw-semibold text-secondary small me-2">🎯 빠른 바로가기 :</span>
        <button class="btn btn-sm btn-outline-dark rounded-pill qa-nav-btn" data-target-qa="headingOne">취소/환불 규정</button>
        <button class="btn btn-sm btn-outline-dark rounded-pill qa-nav-btn" data-target-qa="headingTwo">준비물 안내</button>
        <span id="qaDynamicNavContainer" class="d-inline-flex gap-2"></span>
    </div>

    <!-- 부트스트랩 아코디언 구조 (고유 ID 체계로 충돌 전면 차단) -->
    <div class="accordion shadow-sm rounded-3 overflow-hidden" id="gilmajungFaqAccordion">
        <!-- 기본 질문 1 -->
        <div class="accordion-item border-light-subtle">
            <h2 class="accordion-header" id="headingOne">
                <button class="accordion-button collapsed fw-semibold text-dark" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                    Q1. 예약 취소 및 환불 규정은 어떻게 되나요?
                </button>
            </h2>
            <div id="collapseOne" class="accordion-collapse collapse" aria-labelledby="headingOne" data-bs-parent="#gilmajungFaqAccordion">
                <div class="accordion-body bg-white text-secondary" style="line-height: 1.6;">
                    여행 출발 7일 전까지는 100% 전액 환불이 가능합니다. 이후 취소 시점에 따라 차등 수수료가 부과되오니 고지된 여행약관 및 고객센터 규정을 참고해 주세요.
                </div>
            </div>
        </div>

        <!-- 기본 질문 2 -->
        <div class="accordion-item border-light-subtle">
            <h2 class="accordion-header" id="headingTwo">
                <button class="accordion-button collapsed fw-semibold text-dark" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                    Q2. 가이드 투어 시 개인 준비물이 있나요?
                </button>
            </h2>
            <div id="collapseTwo" class="accordion-collapse collapse" aria-labelledby="headingTwo" data-bs-parent="#gilmajungFaqAccordion">
                <div class="accordion-body bg-white text-secondary" style="line-height: 1.6;">
                    도보 이동이 많으므로 편안한 운동화 착용을 적극 권장합니다. 개인 무선 이어폰을 지참하시면 투어 수신기 연결이 한층 더 수월합니다.
                </div>
            </div>
        </div>
    </div>
</section>

<!-- 다른 JS 파일이나 라이브러리와 절대 간섭하지 않는 안전 격리 스크립트 -->
<script>
    (function() {
        let qaIndex = 2; // 기존 기본 질문 수
        const btnLoadMore = document.getElementById('btnLoadMoreQA');
        const accordionContainer = document.getElementById('gilmajungFaqAccordion');
        const navContainer = document.getElementById('qaDynamicNavContainer');

        // [기능 2] 버튼창 이동 기능 스크롤 핸들러 (충돌 없는 표준 스크롤 이동)
        function initScrollNavigation(element) {
            element.addEventListener('click', function(e) {
                e.preventDefault();
                const targetId = this.getAttribute('data-target-qa');
                const targetElement = document.getElementById(targetId);

                if (targetElement) {
                    // 해당 질문 요소를 찾아서 부드럽게 화면 중앙 부근으로 이동
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });

                    // 이동 후 아코디언 버튼을 강제로 열어 가시성 확보
                    const targetButton = targetElement.querySelector('.accordion-button');
                    if (targetButton && targetButton.classList.contains('collapsed')) {
                        targetButton.click();
                    }
                }
            });
        }

        // 기본 제공 이동 버튼들에 기능 바인딩
        document.querySelectorAll('.qa-nav-btn').forEach(btn => initScrollNavigation(btn));

        // [기능 3] 지속적 질문 업데이트 기능 (비동기 데이터 누적 추가)
        if (btnLoadMore && accordionContainer) {
            btnLoadMore.addEventListener('click', function() {
                qaIndex++;
                btnLoadMore.disabled = true;
                btnLoadMore.textContent = '불러오는 중...';

                // 샘플 데이터 배열 (실제 운영 시 이 영역을 fetch('/api/qa') API 연동으로 교체 가능)
                const mockTitles = [
                    "길마중 패키지 여행 시 가이드 팁은 필수인가요?",
                    "우천 등 기상 악화 시 투어 일정이 취소되나요?",
                    "단체 예약 시 추가 할인을 적용받을 수 있나요?"
                ];
                const mockAnswers = [
                    "길마중의 모든 전용 투어 상품은 공식 가이드 비용이 포함되어 있어 별도의 팁 강요가 절대 없습니다.",
                    "안전에 지장이 없는 가벼운 비의 경우 정상 진행됩니다. 단, 천재지변급 기상악화 시 전액 환불 혹은 일정 변경 조치됩니다.",
                    "10인 이상의 대가족이나 기업 연수 투어의 경우, 고객센터를 통해 맞춤형 견적 및 추가 프로모션 적용이 가능합니다."
                ];

                // 가상 인덱스 매칭을 통한 무한 루프 데이터 생성
                const selectIdx = (qaIndex - 3) % mockTitles.length;
                const dynamicTitle = `Q${qaIndex}. ${mockTitles[selectIdx]}`;
                const dynamicAnswer = mockAnswers[selectIdx];
                const newTargetId = `headingGenerated${qaIndex}`;
                const newCollapseId = `collapseGenerated${qaIndex}`;

                setTimeout(() => {
                    // 1. 아코디언 리스트 리프레시 추가
                    const newQaNode = document.createElement('div');
                    newQaNode.className = 'accordion-item border-light-subtle';
                    newQaNode.innerHTML = `
                        <h2 class="accordion-header" id="${newTargetId}">
                            <button class="accordion-button collapsed fw-semibold text-dark" type="button" data-bs-toggle="collapse" data-bs-target="#${newCollapseId}" aria-expanded="false" aria-controls="${newCollapseId}">
                                ${dynamicTitle}
                            </button>
                        </h2>
                        <div id="${newCollapseId}" class="accordion-collapse collapse" aria-labelledby="${newTargetId}" data-bs-parent="#gilmajungFaqAccordion">
                            <div class="accordion-body bg-white text-secondary" style="line-height: 1.6;">
                                ${dynamicAnswer}
                            </div>
                        </div>
                    `;
                    accordionContainer.appendChild(newQaItemNode = newQaNode);

                    // 2. 상단 이동 버튼 네비게이션바에도 동적 버튼 연동 자동화
                    if (navContainer) {
                        const newNavBtn = document.createElement('button');
                        newNavBtn.className = 'btn btn-sm btn-outline-primary rounded-pill fade-in-animation';
                        newNavBtn.setAttribute('data-target-qa', newTargetId);
                        // 가시성을 위해 앞부분 명칭만 발췌 표기
                        newNavBtn.textContent = mockTitles[selectIdx].substring(0, 6) + '...';
                        navContainer.appendChild(newNavBtn);

                        // 새로 생성된 바로가기 버튼에도 즉시 스크롤 기능 투입
                        initScrollNavigation(newNavBtn);
                    }

                    // 버튼 상태 복구
                    btnLoadMore.disabled = false;
                    btnLoadMore.textContent = '질문 더보기 ↻';
                }, 400); // 부드러운 전개를 위한 가상 딜레이 시간 적용
            });
        }
    })();
</script>

<!-- 주석 정상 마감 및 UI 향상 테마 CSS 코드 -->
<style>
    .qa-custom-section .accordion-button:not(.collapsed) {
        background-color: var(--bs-primary-bg-subtle, #cfe2ff) !important;
        color: var(--bs-primary-text-emphasis, #052c65) !important;
        box-shadow: none !important;
    }
    .qa-custom-section .accordion-button:focus {
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15) !important;
    }
    /* 동적 추가 버튼 생성 시 부드러운 등장 애니메이션 */
    .fade-in-animation {
        animation: qaFadeIn 0.3s ease-in-out forwards;
    }
    @keyframes qaFadeIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
    }
</style>
